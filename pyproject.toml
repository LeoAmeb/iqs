# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"

# Match Ruff's recommended default exclusions
exclude = [
  ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
  ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv",
  ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox",
  ".venv", ".vscode", "__pypackages__", "_build", "buck-out",
  "build", "dist", "node_modules", "site-packages", "venv",
  # Project-specific
  "*/migrations/*",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking (move type-only imports to TYPE_CHECKING)
  "RUF",  # Ruff-specific rules
]
ignore = [
  "E501",   # line too long — handled by formatter
  "B008",   # do not perform function calls in default arguments (common in DRF/Django)
  "RUF012", # mutable class attributes — common in Django models
  "SIM108", # ternary operator — can reduce readability
]

# Never auto-fix these — they can change runtime behaviour
unfixable = ["B"]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Star imports are intentional in settings cascade files
"*/settings/*.py" = ["F405", "F403"]
# __init__.py re-exports are expected
"**/__init__.py"  = ["F401"]
# Test files can use assert and magic values freely
"**/test_*.py"    = ["S101", "S106", "PLR2004"]

[tool.ruff.format]
quote-style            = "double"
indent-style           = "space"
skip-magic-trailing-comma = false
line-ending            = "auto"
# Format code examples inside docstrings
docstring-code-format  = true
docstring-code-line-length = "dynamic"

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version        = "3.12"
plugins               = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict                = false
ignore_missing_imports = true
warn_unused_ignores   = true
warn_redundant_casts  = true
# Disallow untyped function bodies in app code (but not migrations/tests)
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.development"

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files   = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
testpaths = ["apps"]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "integration: marks tests that require external services",
]
